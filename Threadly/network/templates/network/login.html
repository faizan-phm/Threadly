{% extends "network/layout.html" %}

{% block body %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-5">
    <div class="auth-card shadow-lg p-4">
      <h2 class="mb-4 text-center text-info">Login to Threadly</h2>
      <form class="needs-validation" id="loginform" novalidate method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
          <label for="username">Username</label>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Please enter your username.</div>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" name="password" placeholder="Password" required minlength="6">
          <label for="password">Password</label>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback">Please enter your password (min 6 chars).</div>
        </div>
        <button class="btn btn-info w-100 py-2 text-white" type="submit">Login</button>
      </form>
      <div class="mt-3 text-center">
        <a href="{% url 'register' %}" class="text-info">Don't have an account? Register</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
